[package]
name = "forge"
version = "0.1.0"
edition = "2021"
description = "CLI утилита для управления контекстом ИИ-агентов"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
repository = "https://github.com/yourusername/forge"
readme = ".agent/README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
toml = "0.8"
walkdir = "2.4"
pulldown-cmark = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = "0.4"

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "forge"
path = "src/main.rs"